<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>١١/١١ — لـ رودي</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Aref+Ruqaa:wght@400;700&family=Tajawal:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#FFF1EA; --ink:#3A1431; --soft:#7A4A6B; --rose:#E86A8A; --peach:#FFD3C2; --gold:#C98A1E; --card:#FFFFFF;
  box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){ --bg:#24091F; --ink:#FFE9E1; --soft:#D9A9C4; --rose:#FF86A5; --peach:#5A2145; --gold:#F2C063; --card:#34122D; }
}
:root[data-theme="dark"]{ --bg:#24091F; --ink:#FFE9E1; --soft:#D9A9C4; --rose:#FF86A5; --peach:#5A2145; --gold:#F2C063; --card:#34122D; }
html{height:100%; scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0; background:var(--bg); color:var(--ink); font-family:"Tajawal",system-ui,sans-serif; line-height:1.8; overflow-x:hidden}
.wrap{max-width:560px; margin:0 auto; padding:0 22px}

/* hero */
.hero{min-height:92vh; display:flex; flex-direction:column; align-items:center; justify-content:center; text-align:center; padding:48px 0 24px}
.ones{position:relative; width:220px; height:230px; margin-bottom:28px}
.one{position:absolute; bottom:0; width:46px; height:190px; border-radius:24px; background:var(--ink)}
.one::before{content:""; position:absolute; top:-6px; width:46px; height:46px; border-radius:50%; background:inherit}
.one.a{right:46px; transform-origin:bottom center; animation:lean-a 1.6s .3s cubic-bezier(.3,1.4,.5,1) forwards}
.one.b{left:46px; transform-origin:bottom center; background:var(--rose); animation:lean-b 1.6s .3s cubic-bezier(.3,1.4,.5,1) forwards}
@keyframes lean-a{to{transform:rotate(-9deg) translateX(-14px)}}
@keyframes lean-b{to{transform:rotate(9deg) translateX(14px)}}
.heart{position:absolute; top:0; left:50%; width:38px; height:38px; margin-left:-19px; color:var(--rose); opacity:0; transform:scale(.2); animation:pop .9s 1.5s ease-out forwards}
.heart svg{width:100%; height:100%; fill:currentColor}
@keyframes pop{60%{transform:scale(1.25)}100%{opacity:1; transform:scale(1)}}
.date{font-family:"Aref Ruqaa",serif; font-weight:700; font-size:clamp(3.2rem,16vw,5.2rem); line-height:1; margin:0; letter-spacing:.02em}
.hero h1{font-family:"Aref Ruqaa",serif; font-weight:400; font-size:clamp(1.5rem,6.4vw,2.1rem); margin:14px 0 8px; color:var(--rose)}
.hero p{margin:0; color:var(--soft); max-width:30ch}
.hint{margin-top:34px; font-size:.95rem; color:var(--soft)}

/* why */
.why{padding:36px 0 16px; text-align:center}
.why p{font-size:1.15rem; margin:0 0 14px}

/* messages */
.deck{padding:28px 0 60px; text-align:center}
.card{position:relative; background:var(--card); border-radius:28px; padding:34px 26px 28px; min-height:210px; display:flex; flex-direction:column; align-items:center; justify-content:center; box-shadow:0 14px 40px -18px var(--rose); border:2px solid var(--peach)}
.card .n{font-size:.9rem; color:var(--soft); margin-bottom:12px}
.card .msg{font-family:"Aref Ruqaa",serif; font-size:clamp(1.35rem,5.6vw,1.8rem); line-height:1.9; margin:0}
.card .msg.swap{animation:swap .5s ease}
@keyframes swap{from{opacity:0; transform:translateY(10px)}to{opacity:1; transform:none}}
button.go{margin-top:22px; font:inherit; font-weight:700; font-size:1.05rem; color:#fff; background:var(--rose); border:0; border-radius:999px; padding:14px 34px; cursor:pointer; min-height:48px; box-shadow:0 8px 20px -8px var(--rose)}
button.go:active{transform:scale(.97)}
button.go:focus-visible{outline:3px solid var(--gold); outline-offset:3px}
footer{text-align:center; padding:10px 0 48px; color:var(--soft); font-size:.95rem}

/* floating hearts (on tap) */
.fl{position:fixed; pointer-events:none; color:var(--rose); font-size:22px; animation:up 1.8s ease-out forwards; z-index:5}
@keyframes up{to{transform:translateY(-160px) scale(1.3); opacity:0}}
@media (prefers-reduced-motion: reduce){
  .one.a{animation:none; transform:rotate(-9deg) translateX(-14px)}
  .one.b{animation:none; transform:rotate(9deg) translateX(14px)}
  .heart{animation:none; opacity:1; transform:none}
  .card .msg.swap,.fl{animation:none}
}
</style>
</head>
<body>
<main class="wrap">
  <section class="hero">
    <div class="ones" aria-hidden="true">
      <div class="one a"></div>
      <div class="one b"></div>
      <div class="heart"><svg viewBox="0 0 24 24"><path d="M12 21s-7.5-4.6-9.6-9.2C.9 8.4 2.7 4.8 6.2 4.8c2 0 3.5 1.1 4.3 2.5l1.5 2.4 1.5-2.4c.8-1.4 2.3-2.5 4.3-2.5 3.5 0 5.3 3.6 3.8 7C19.500 16.400 12 21 12 21z"/></svg></div>
    </div>
    <h2 class="date">11/11</h2>
    <h1>إحنا الاتنين اللي واقفين جنب بعض</h1>
    <p>كل سنة وإنتي طيبة يا رودي</p>
    <div class="hint">انزلي شوفي رسايلك ↓</div>
  </section>

  <section class="why">
    <p>رقم ١ لوحده حلو.</p>
    <p>بس لما يقف جنب ١ تاني، يبقى ١١ وأحلى.</p>
    <p>عشان كده ١١/١١ عيد حب صغير عندنا في مصر، وده نصيبك منه.</p>
  </section>

  <section class="deck" aria-live="polite">
    <div class="card">
      <div class="n" id="count">رسالة ١ من ٦</div>
      <p class="msg" id="msg">وجودك بيخلي اليوم العادي يبقى عيد صغير.</p>
      <button class="go" id="next" type="button">الرسالة اللي بعدها</button>
    </div>
  </section>

  <footer>صُنع بحب، لـ رودي</footer>
</main>

<script>
const msgs = [
  "وجودك بيخلي اليوم العادي يبقى عيد صغير.",
  "مش محتاج يوم مخصوص عشان أقولك إني بحبك، بس النهارده حجة حلوة.",
  "شكراً إنك جنبي في الزحمة وفي الهدوء.",
  "لو كل الأيام ١١/١١ كنت اتبسطت.",
  "أحلى حاجة في أي يوم إني أعرف إنك فيه.",
  "كل سنة وإنتي طيبة يا رودي ♡"
];
const ar = n => String(n).replace(/\d/g, d => "٠١٢٣٤٥٦٧٨٩"[d]);
let i = 0;
const msg = document.getElementById("msg"), count = document.getElementById("count"), btn = document.getElementById("next");
function hearts(x, y){
  for(let k=0;k<7;k++){
    const h = document.createElement("div");
    h.className = "fl"; h.textContent = "♥";
    h.style.left = (x + (Math.random()*90-45)) + "px";
    h.style.top = (y + (Math.random()*20-10)) + "px";
    h.style.animationDelay = (k*60) + "ms";
    document.body.appendChild(h);
    setTimeout(() => h.remove(), 2200);
  }
}
btn.addEventListener("click", e => {
  i = (i + 1) % msgs.length;
  msg.textContent = msgs[i];
  count.textContent = "رسالة " + ar(i+1) + " من " + ar(msgs.length);
  msg.classList.remove("swap"); void msg.offsetWidth; msg.classList.add("swap");
  btn.textContent = i === msgs.length - 1 ? "من الأول" : "الرسالة اللي بعدها";
  hearts(e.clientX || innerWidth/2, e.clientY || innerHeight/2);
});
</script>
</body>
</html>
